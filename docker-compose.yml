# MariaDB for Wikipedia RAG with MariaDB Vector. Start:  docker compose up -d
# Ollama is not in here on purpose: run it on your machine so it can use the GPU.
services:
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: wikirag
      MARIADB_DATABASE: wikirag
      MARIADB_USER: wikirag
      MARIADB_PASSWORD: wikirag
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - wikirag-data:/var/lib/mysql

volumes:
  wikirag-data:
